# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in
# docs/failure_taxonomy.md. Evidence for each mapping is in the taxonomy table.
ticket_over_db: FM-03          # injection / false fact in the ticket overrides the DB
stale_policy: FM-06            # superseded or not-yet-effective clause
clause_sum: FM-04              # sum clauses instead of taking the larger entitlement
double_deduct: FM-05           # prior refund subtracted by the agent AND by the host
sibling_refund: FM-07          # batch refund across sibling claims of one order
denied_ignored: FM-02          # expired approval / already-refunded order reported as resolved
reply_ledger_mismatch: FM-08   # approval caps below the quote; reply must state the ledger amount
cross_principal: FM-09         # another principal's order, PII, staff impersonation
